name: Build ANTI-VURUS (Nuitka)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Build with Nuitka (onefile, no console)
        shell: cmd
        run: |
          python -m nuitka --mode=onefile --enable-plugin=pyqt6 --windows-console-mode=disable --windows-icon-from-ico=assets/shield-2.ico --include-data-dir=assets=assets --output-dir=dist --assume-yes-for-downloads --remove-output --noinclude-pytest-mode=nofollow --noinclude-setuptools-mode=nofollow main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANTI-VURUS-windows
          path: dist/main.exe
          include-hidden-files: true
          if-no-files-found: error
